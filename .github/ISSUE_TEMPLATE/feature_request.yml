name: Feature request
description: Suggest something new or better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, in your own words — not the solution yet
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could DockGate help?
      description: What you would click, see or get
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: CLI commands, another tool, a workaround
  - type: markdown
    attributes:
      value: |
        DockGate is built for one admin running their own servers. Ideas about user roles or multi-tenant setups are out of scope.
